name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
      - task-*

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/meridian.py --framework-root . profile doctor meridian-self-hosting --project .
      - run: python3 scripts/meridian.py --framework-root . audit --project . --mode lean-delivery --ci-profile meridian-self-hosting
      - run: python3 -m unittest discover -s tests -v
